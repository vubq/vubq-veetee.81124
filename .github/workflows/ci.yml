name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use workspace npm version
        run: npm install --global npm@11.16.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.3"

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --project apps/realtime --locked

      - name: Run repository checks
        run: npm run check

      - name: Check built PostgreSQL migration package offline
        run: npm run db:check

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: compose-config-validation-only
          REDIS_PASSWORD: compose-config-validation-only
        run: docker compose config --quiet

  postgres-integration:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: veetee_integration
          POSTGRES_USER: veetee_integration
          POSTGRES_PASSWORD: integration-only-password
        options: >-
          --health-cmd "pg_isready -U veetee_integration -d veetee_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432/tcp

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Use workspace npm version
        run: npm install --global npm@11.16.0

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify built PostgreSQL foundation
        env:
          DATABASE_URL: postgresql://veetee_integration:integration-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/veetee_integration
        run: npm run db:verify

      - name: Run PostgreSQL foundation integration test
        env:
          DATABASE_URL: postgresql://veetee_integration:integration-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/veetee_integration
        run: npm run test:integration:postgres
